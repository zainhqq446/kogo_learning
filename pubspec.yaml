name: kogo_voice_learning
description: "Kogo Belajar — interactive Android learning media with voice recognition for early-childhood word exploration (ages 5–6)."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database (offline-first)
  sqflite: ^2.4.4
  path: ^1.9.1
  uuid: ^4.6.0

  # Voice: Google Speech-to-Text (Android SpeechRecognizer) & Text-to-Speech
  speech_to_text: 7.5.0
  flutter_tts: ^4.2.5

  # Sound effects & background music
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/audio/sfx/
    - assets/audio/bgm/
    # Kogo's recorded voice (ElevenLabs), generated by tool/generate_voice.py.
    - assets/voice/
    # Only concrete-noun images are bundled (thesis scope: fruits, animals,
    # everyday objects). Verb/adjective folders stay in the repository but
    # are not shipped in the APK.
    - assets/dataset_gambar/1_dua_suku_kata/kata_benda/
    - assets/dataset_gambar/2_tiga_suku_kata/kata_benda/
    - assets/dataset_gambar/3_lebih_dari_tiga_suku_kata/kata_benda/
